openapi: 3.0.3
info:
  title: httpbin — three-operation documentation sample
  version: 1.0.0
  description: |
    Independent AI-authored documentation sample covering three GET operations
    in postmanlabs/httpbin at f8ec666b4d1b654e4ff6aedd356f510dcac09f83.
    This is a scoped portfolio example, not official or complete httpbin documentation.
    Behavior is verified locally against the pinned source, not the public deployment.
    The server URL denotes a local test deployment; no hosted service is supplied.
    Only synthetic credentials should be used with the authentication test endpoint.
  contact:
    name: Ashkno Coding Agent
    url: https://github.com/ashkno
  license:
    name: ISC
    url: https://github.com/postmanlabs/httpbin/blob/f8ec666b4d1b654e4ff6aedd356f510dcac09f83/LICENSE
servers:
  - url: http://localhost:5000
    description: Local test deployment of the pinned source
security: []
tags:
  - name: Dynamic data
    description: Small generated or transformed responses.
  - name: Authentication
    description: Synthetic HTTP Basic authentication checks.
paths:
  /uuid:
    get:
      operationId: getUuid
      summary: Generate a version 4 UUID
      description: |
        Returns a fresh UUID generated by Python uuid.uuid4().
        No parameters or authentication are required. The value in the example
        is illustrative; the response changes for each call.
      tags: [Dynamic data]
      x-source: https://github.com/postmanlabs/httpbin/blob/f8ec666b4d1b654e4ff6aedd356f510dcac09f83/httpbin/core.py#L316
      responses:
        '200':
          description: A generated UUID as a JSON string property.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [uuid]
                properties:
                  uuid:
                    type: string
                    format: uuid
                    pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
              example:
                uuid: 7d9d58fb-b13b-4b4c-9e15-54a6cfcf01f5
  /base64/{value}:
    get:
      operationId: decodeBase64
      summary: Decode base64url data as UTF-8 text
      description: |
        The route passes the value to Python base64.urlsafe_b64decode and then
        decodes the result as UTF-8. Include required base64 padding; the function
        does not add it. Python's decoder is permissive and may ignore non-alphabet
        characters, so this endpoint is not a strict base64 validator.

        Both successful decoding and handled decoding errors return HTTP 200
        with text/html content. Errors are represented by a fixed string, not a
        JSON error object or a 4xx status. Empty decoded text is possible.
        The path parameter is a single nonempty URL segment.
      tags: [Dynamic data]
      x-source: https://github.com/postmanlabs/httpbin/blob/f8ec666b4d1b654e4ff6aedd356f510dcac09f83/httpbin/core.py#L1290
      parameters:
        - name: value
          in: path
          required: true
          description: Base64url-encoded UTF-8 text, with padding where required.
          schema:
            type: string
            minLength: 1
          examples:
            hello:
              value: SGVsbG8=
              summary: Decodes to Hello
            missingPadding:
              value: SGVsbG8
              summary: Returns the decoding-error text with status 200
      responses:
        '200':
          description: Decoded text, or the fixed decoding-error message.
          content:
            text/html:
              schema:
                type: string
              examples:
                decoded:
                  value: Hello
                decodingError:
                  value: 'Incorrect Base64 data try: SFRUUEJJTiBpcyBhd2Vzb21l'
                ignoredNonAlphabetCharacters:
                  value: ''
                  summary: Input !!!! produces empty decoded text in the pinned runtime
  /basic-auth/{user}/{passwd}:
    get:
      operationId: checkBasicAuth
      summary: Check Basic credentials against values in the path
      description: |
        Compares the username and password parsed from the Authorization header
        with the two path parameters. This is an authentication demonstration,
        not a user account or login service. Path credentials can appear in URLs
        and logs; use synthetic values only.
        Missing or incorrect credentials produce an empty 401 response.
      tags: [Authentication]
      x-source: https://github.com/postmanlabs/httpbin/blob/f8ec666b4d1b654e4ff6aedd356f510dcac09f83/httpbin/core.py#L944
      security:
        - basicAuth: []
      parameters:
        - name: user
          in: path
          required: true
          description: Expected synthetic username; one nonempty URL segment.
          schema:
            type: string
            minLength: 1
          example: demo
        - name: passwd
          in: path
          required: true
          description: Expected synthetic password; one nonempty URL segment.
          schema:
            type: string
            minLength: 1
          example: sample
      responses:
        '200':
          description: Both credentials match the path parameters.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [authenticated, user]
                properties:
                  authenticated:
                    type: boolean
                    enum: [true]
                  user:
                    type: string
              example:
                authenticated: true
                user: demo
        '401':
          description: Missing or incorrect credentials; response body is empty.
          headers:
            WWW-Authenticate:
              description: HTTP Basic authentication challenge.
              schema:
                type: string
                enum: ['Basic realm="Fake Realm"']
              example: 'Basic realm="Fake Realm"'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Synthetic credentials matching the username and password in the URL.
